name: Build-Test-Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup esbuild
        run: npm install -g esbuild

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '4.0.21'
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten installation
        run: emcc --version

      - name: Setup Rust (nightly for the shared-memory std, wasm32 for the MIDI and gamepad modules)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          targets: wasm32-unknown-unknown,wasm32-unknown-emscripten
          components: rust-src

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127

      # Before the build: the bundling half of build-web.sh runs esbuild from
      # node_modules and resolves @thi.ng/malloc from there.
      - name: Install npm dependencies
        run: npm install

      - name: Run build script (release mode)
        run: ./scripts/build-web.sh --release

      - name: Verify build output
        run: |
          ls -lh dist/
          test -f dist/supersonic.js || { echo "Error: supersonic.js not found"; exit 1; }
          test -f dist/wasm/scsynth-nrt.wasm || { echo "Error: scsynth-nrt.wasm not found"; exit 1; }
          test -f dist/midi/clockwork_midi.js || { echo "Error: dist/midi/clockwork_midi.js not found (MIDI wasm build was skipped)"; exit 1; }
          test -f dist/gamepad/clockwork_gamepad.js || { echo "Error: dist/gamepad/clockwork_gamepad.js not found (gamepad wasm build was skipped)"; exit 1; }
          test -f packages/supersonic-scsynth-core/wasm/scsynth-nrt.wasm || { echo "Error: core package has no wasm"; exit 1; }
          echo "Build verification passed!"

      - name: Run type tests
        run: npm run test:types

      # The nova-simd wasm128 backend the engine's DSP loops compile against,
      # every operation checked against a scalar reference (test/wasm_simd).
      - name: Run nova-simd wasm128 tests
        run: npm run test:simd

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Replace symlinks with actual files for distribution
        run: |
          # build-web.sh copies these in as real directories now; upstream's
          # symlinked them. Either way, replace them with the packages' files.
          rm -rf dist/synthdefs dist/samples

          echo "Copying all 120 synthdefs..."
          mkdir -p dist/synthdefs
          cp -r packages/supersonic-scsynth-synthdefs/synthdefs/* dist/synthdefs/
          echo "Copied $(ls -1 dist/synthdefs/*.scsyndef | wc -l) synthdef files"

          echo "Copying all 206 samples..."
          mkdir -p dist/samples
          cp -r packages/supersonic-scsynth-samples/samples/* dist/samples/
          echo "Copied $(ls -1 dist/samples/ | wc -l) sample files"

      - name: Create zip archive
        run: |
          mkdir -p supersonic
          cp -r dist/* supersonic/
          rm -rf supersonic/.github-pages
          # Add README with version
          VERSION="${GITHUB_REF_NAME:-dev}"
          sed "s/{{VERSION}}/$VERSION/" docs/README.dist.md > supersonic/README.md
          zip -r supersonic-dist.zip supersonic
          rm -rf supersonic
          cp supersonic-dist.zip dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: zip
          path: supersonic-dist.zip

