name: Native Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "native-${{ github.ref }}"
  cancel-in-progress: true

# SuperSonic is clockwork (a submodule) plus the scsynth guest (dsp/scsynth).
# Every job checks the submodule out; without it there is nothing to build.
#
# What is NOT here, and why: the BEAM NIF runtime tests, the freestanding
# no-synth engine, the MIT scheduler host, the ESP32-S3 build and the Rust
# transport crate's own tests all covered code that now lives in clockwork.
# clockwork's CI runs them. This workflow covers what is SuperSonic's: the
# guest, the host process, the native test suite and the command transports.

jobs:
  # ── Core logging guard ──────────────────────────────────────────────────────
  # The scsynth core logs through the egress funnel — ss_log / scprintf / the
  # interface table's Print — never raw stdio. Raw stdio output vanishes in
  # the WASM AudioWorklet (no usable stdout), bypasses the /supersonic/debug
  # channel the hosts surface, and takes the stdio stream lock on the audio
  # thread. This guard fails on any live printf-family call in the core.
  # Exemptions are narrow and deliberate:
  #   external_libraries/  vendored code (TLSF, boost)
  #   SC_Win32Utils.cpp    native-only Win32 helpers, never compiled to WASM
  #   SC_World.cpp         World_New exception handlers must not use ss_log
  #                        (the ring may not exist when they fire); the NRT
  #                        render loop's progress output is native-only
  #   PriorityQueue.h,     hand-invoked debug dump helpers
  #   HashTable.h
  # The pattern skips lines with any '/' before the call, which excludes
  # //-comments (block-commented calls should be deleted, not kept).
  core-logging-guard:
    runs-on: ubuntu-latest
    name: core-logging-guard
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Forbid raw stdio logging in the scsynth core
        run: |
          set -uo pipefail
          hits=$(grep -RnE '^[^/]*\b(printf|fprintf|vprintf|vfprintf|puts|fputs)[[:space:]]*\(' dsp/scsynth/synth \
            --include='*.c' --include='*.cpp' --include='*.h' --include='*.hpp' \
            --exclude-dir=external_libraries \
            --exclude=SC_Win32Utils.cpp \
            --exclude=SC_World.cpp \
            --exclude=PriorityQueue.h \
            --exclude=HashTable.h \
            || true)
          if [ -n "$hits" ]; then
            echo "Raw stdio logging found in the scsynth core."
            echo "Use the egress funnel instead: Print(...) in plugins, ss_log/scprintf elsewhere."
            echo "$hits"
            exit 1
          fi

      - name: Forbid raw stdio logging in the front
        run: |
          set -uo pipefail
          # The front runs in the engine's process beside clockwork's engine and
          # logs the way it does: through clockwork_log, onto the debug ring.
          # (host/ is the process main; its stderr is its own.)
          hits=$(grep -RnE '^[^/]*\b(printf|fprintf|vprintf|vfprintf|puts|fputs)[[:space:]]*\(' front \
            --include='*.cpp' --include='*.h' || true)
          if [ -n "$hits" ]; then
            echo "Raw stdio logging found in the front. Use clockwork_log."
            echo "$hits"
            exit 1
          fi
          echo "scsynth core is clean: all logging flows through the egress funnel."

  # ── Native executable + test suite ──────────────────────────────────────────
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: windows-latest
            name: windows-x64
          # - os: windows-arm64        # temporarily disabled — runner queue too slow
          #   name: windows-arm64

    runs-on: ${{ matrix.os }}
    name: native-${{ matrix.name }}
    # A healthy build+test run is ~20 min; cap it so a teardown/test hang fails
    # fast instead of holding a runner to GitHub's 6-hour default.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock', 'clockwork/rust/Cargo.lock') }}

      # smoothie, clockwork's device layer (a fork of four JUCE 7 modules,
      # in-tree, not a dependency), needs the X11/freetype set to
      # configure on Linux even for a headless build; ALSA, JACK and PipeWire
      # are the audio backends it compiles in.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libudev-dev libjack-jackd2-dev libpipewire-0.3-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev

      - name: Configure
        run: cmake -B build/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build main binary
        run: cmake --build build/native --config Release --parallel --target SuperSonic

      - name: Build tests
        # Capped at 2 parallel jobs to avoid OOM on the 16 GB GitHub runners:
        # the test target compiles Catch2 and 100-odd test sources alongside
        # the engine.
        run: cmake --build build/native --config Release --parallel 2 --target SuperSonicNativeTests

      - name: Run tests
        env:
          SUPERSONIC_QUIET: "1"   # silence per-boot lifecycle logging in CI
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/native/test/native/Release/SuperSonicNativeTests.exe "~[benchmark]"
          else
            ./build/native/test/native/SuperSonicNativeTests "~[benchmark]"
          fi
        shell: bash

      # End-to-end command transports: boot the real binary headless once per
      # transport (UDP/TCP/UDS/SHM on unix; UDP/TCP/named pipe/SHM on Windows)
      # and require a /status reply over that transport (test/transport-harness/).
      - name: Transport harness
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -File test/transport-harness/run.ps1
          else
            test/transport-harness/run.sh
          fi

      - name: Locate binary
        id: binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "path=build/native/Release/SuperSonic.exe" >> "$GITHUB_OUTPUT"
            echo "artifact=supersonic-${{ matrix.name }}.exe" >> "$GITHUB_OUTPUT"
          else
            echo "path=build/native/SuperSonic" >> "$GITHUB_OUTPUT"
            echo "artifact=supersonic-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          fi

      # Release builds compile with debug info so a crash dump can be
      # symbolicated (clockwork's CMakeLists, "Release debug symbols"). The
      # binary a user downloads must not carry it: on Linux the DWARF for
      # clockwork, scsynth and the Rust std made an 11 MB server 87 MB. So the
      # debug info is split off beside the binary and uploaded with it —
      # a .debug file with a debuglink on Linux, a dSYM on macOS, the PDB on
      # Windows — and the binary itself is stripped.
      - name: Prepare release artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          src="${{ steps.binary.outputs.path }}"
          out="${{ steps.binary.outputs.artifact }}"
          mkdir -p release
          cp "$src" "release/$out"
          case "$RUNNER_OS" in
            Linux)
              objcopy --only-keep-debug "release/$out" "release/$out.debug"
              strip --strip-debug --strip-unneeded "release/$out"
              objcopy --add-gnu-debuglink="release/$out.debug" "release/$out"
              ;;
            macOS)
              dsymutil "release/$out" -o "release/$out.dSYM"
              strip -x "release/$out"
              (cd release && zip -qr "$out.dSYM.zip" "$out.dSYM" && rm -rf "$out.dSYM")
              ;;
            Windows)
              cp "${src%.exe}.pdb" "release/${out%.exe}.pdb" 2>/dev/null || true
              ;;
          esac
          ls -la release

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.binary.outputs.artifact }}
          path: release/

  # ── Native executable, 32-bit x86 ───────────────────────────────────────────
  # i686 is the one desktop target where the engine's lock-free assumptions can
  # actually break: 8-byte atomics lower to cmpxchg8b and may need libatomic,
  # where every 64-bit target gets them for free. This job is what proves the
  # guest and the host hold on it; clockwork's own CI proves the substrate.
  #
  # Not folded into the native matrix above because it can't use a plain
  # runner: Ubuntu dropped i386 as a full architecture in 19.10, so most of
  # smoothie's -dev dependencies have no i386 build there. Debian still carries a
  # complete i386 archive, so the build runs in a Debian i386 container on an
  # x86_64 host. Nothing is emulated — x86_64 runs 32-bit code natively — and
  # the container can't be a job-level `container:` because the runner injects
  # an x86_64 Node to execute JS actions, which an i386 rootfs cannot load.
  native-x86:
    runs-on: ubuntu-latest
    name: native-linux-x86
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # One long-lived container so the apt install is shared while each phase
      # still gets its own step, making a failure point at the stage that broke.
      - name: Start 32-bit container
        run: |
          docker run -d --name ss32 \
            --platform linux/386 \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            i386/debian:bookworm sleep infinity

      - name: Install dependencies
        run: docker exec ss32 scripts/ci-linux-x86.sh deps

      - name: Configure
        run: docker exec ss32 scripts/ci-linux-x86.sh configure

      - name: Build binary + tests
        run: docker exec ss32 scripts/ci-linux-x86.sh build

      - name: Run tests
        run: docker exec ss32 scripts/ci-linux-x86.sh test

      - name: Transport harness
        run: docker exec ss32 scripts/ci-linux-x86.sh transport

      - name: Stop 32-bit container
        if: ${{ always() }}
        run: docker rm -f ss32 || true

  # ── Embedded-consumer guard (add_subdirectory from a foreign tree) ──────────
  # Sonic Pi builds SuperSonic this way: add_subdirectory() from a tree whose
  # CMAKE_SOURCE_DIR is NOT the SuperSonic root. Every other job configures
  # SuperSonic as the top-level project, where CMAKE_SOURCE_DIR ==
  # CMAKE_CURRENT_SOURCE_DIR, so a mix-up between the two in a source path can
  # never be caught there — it only breaks the embedded build. This is the guard.
  #
  # Configure-only: a misanchored source path fails the generate step ("Cannot
  # find source file"), so reaching "Generating done" is the whole assertion.
  embed-guard:
    runs-on: ubuntu-latest
    name: embed-consumer-guard
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libudev-dev libjack-jackd2-dev libpipewire-0.3-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev

      - name: Configure as embedded subproject
        run: cmake -S test/embed -B build/embed-guard -DBUILD_TESTS=ON

  # ── BEAM NIF shared library (build only) ────────────────────────────────────
  # The NIF is clockwork's (clockwork/src/nif); built here with scsynth as its
  # guest it is SuperSonic-on-the-BEAM. clockwork vendors the erl_nif headers,
  # so no BEAM is needed to build it; its runtime tests run in clockwork's CI.
  nif:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64

    runs-on: ${{ matrix.os }}
    name: nif-${{ matrix.name }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libudev-dev libjack-jackd2-dev libpipewire-0.3-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev

      - name: Configure
        run: cmake -B build/nif -DCLOCKWORK_NIF=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/nif --target clockwork_nif --config Release --parallel 2

  # ── Sanitizer build (ASan+UBSan) ────────────────────────────────────────────
  # Linux only, gcc: the sanitizers exercise the platform-agnostic engine —
  # platform-specific audio backend paths (CoreAudio, WASAPI) are covered by
  # the native matrix above. Plugin hosting is off, as in clockwork's own
  # sanitizer job: the bridge process is not what this job is about.
  #
  # vptr is off: it wants typeinfo for every class with virtuals, and
  # scsynth's SC_AudioDriver has none compiled in (its driver files are not
  # part of this build; the class exists only as a stub) — the link fails on
  # gcc before a single test runs. Upstream's sanitizer build made the same
  # exception.
  #
  # TSan is not run here. The Rust subsystems are not TSan-instrumented in
  # this build, and an uninstrumented staticlib turns every Rust-side
  # happens-before edge into a false positive.
  sanitize:
    runs-on: ubuntu-latest
    name: sanitize-asan-ubsan
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libudev-dev libjack-jackd2-dev libpipewire-0.3-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev

      - name: Configure
        run: |
          cmake -B build/native-sanitize \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTS=ON \
            -DCLOCKWORK_PLUGINS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr"

      - name: Build tests
        # parallel 2 keeps memory usage in check (instrumented builds are
        # heavier than Release).
        run: cmake --build build/native-sanitize --config RelWithDebInfo --parallel 2 --target SuperSonicNativeTests

      - name: Run tests
        env:
          # halt_on_error=1 makes the first sanitizer report fatal — without
          # this UBSan logs and continues, leaving CI green.
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=0:symbolize=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1:symbolize=1"
          SUPERSONIC_QUIET: "1"   # silence per-boot lifecycle logging in CI
        # timeout: a sanitizer abort can wedge instead of exiting, which would
        # otherwise sit silently until the job timeout. -k covers a process
        # stuck past SIGTERM. [load] is excluded: the high-volume load tests
        # are for throughput under saturation, not races/UB.
        run: timeout -k 30 900 ./build/native-sanitize/test/native/SuperSonicNativeTests "~[benchmark]~[load]"

  # ── Attach artifacts to GitHub Release ──────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [native]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: List assets
        run: find release-assets -type f

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
