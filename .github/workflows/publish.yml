name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write   # to queue a job again that no runner took
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup esbuild
        run: npm install -g esbuild

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '4.0.21'
          actions-cache-folder: 'emsdk-cache'

      - name: Setup Rust (nightly for the shared-memory std, wasm32 for the MIDI and gamepad modules)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          targets: wasm32-unknown-unknown,wasm32-unknown-emscripten
          components: rust-src

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127

      # Before the build: the bundling half of build-web.sh runs esbuild from
      # node_modules and resolves @thi.ng/malloc from there.
      - name: Install npm dependencies
        run: npm install

      - name: Build (release mode)
        run: ./scripts/build-web.sh --release

      - name: Run type tests
        run: npm run test:types

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      # Publishing is irreversible, so hold here until every other check run on
      # this commit is green — the native matrix (tag + main refs) and the web
      # Build-Test-Deploy all attach to the same SHA. Our own check run is
      # excluded by its job name. Cancelled or failed runs block the publish;
      # re-run them to green (or re-push the tag) to release.
      - name: Wait for all other CI on this commit to be green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          reruns=""
          for attempt in $(seq 1 240); do
            if ! all_with_ids=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --paginate \
                         --jq '.check_runs[] | select(.name != "publish") | [.status, (.conclusion // "-"), .name, .id] | @tsv'); then
              echo "check-runs API error; retrying"
              sleep 30
              continue
            fi
            all=$(printf '%s\n' "$all_with_ids" | cut -f1-3)
            bad=$(printf '%s\n' "$all" | awk -F'\t' '$1=="completed" && $2!="success" && $2!="neutral" && $2!="skipped"')
            pending=$(printf '%s\n' "$all" | awk -F'\t' '$1!="completed"')
            # A job GitHub cancelled before it ran a step is one no runner
            # took (macOS capacity), not a verdict on the code: queue it
            # again, three times at most, and keep waiting for it.
            requeued=""
            while IFS=$'\t' read -r status conclusion name id; do
              [ "$conclusion" = "cancelled" ] || continue
              steps=$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${id}" --jq '.steps | length' 2>/dev/null || echo "?")
              [ "$steps" = "0" ] || continue
              tries=$(printf '%s\n' $reruns | grep -c "^${id}$")
              if [ "$tries" -ge 3 ]; then
                echo "${name} was never given a runner, three times: giving up"
                continue
              fi
              echo "${name} was never given a runner; queuing it again"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/jobs/${id}/rerun" >/dev/null 2>&1 || true
              reruns="${reruns} ${id}"
              requeued="${requeued}${name} "
            done < <(printf '%s\n' "$all_with_ids" | awk -F'\t' '$1=="completed" && $2=="cancelled"')
            if [ -n "$requeued" ]; then
              sleep 30
              continue
            fi
            if [ -n "$bad" ]; then
              echo "Not publishing — non-green check runs on ${GITHUB_SHA}:"
              printf '%s\n' "$bad"
              exit 1
            fi
            if [ -n "$all" ] && [ -z "$pending" ]; then
              echo "All other check runs green:"
              printf '%s\n' "$all"
              exit 0
            fi
            echo "Attempt ${attempt}/240 — still waiting on:"
            printf '%s\n' "${pending:-<no check runs reported yet>}"
            sleep 30
          done
          echo "Timed out after 2h waiting for CI to complete"
          exit 1

      # One CycloneDX SBOM per build target, with Clockwork's for the pinned
      # commit beside each: SuperSonic's document refers to Clockwork's by BOM
      # link and file name, so the two travel together. The npm packages that
      # carry code and the zip get the web pair; the GitHub release gets all.
      - name: Write the SBOMs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node clockwork/scripts/sbom.mjs --root . target all build/sbom "$VERSION"
          # The Debian package is built with -DCLOCKWORK_PLUGINS=OFF (packaging/debian/rules):
          # its own document, beside the default linux-x64 one.
          node clockwork/scripts/sbom.mjs --root . target linux-x64 build/sbom "$VERSION" --option CLOCKWORK_PLUGINS=OFF --variant deb
          for dir in . packages/supersonic-scsynth-core; do
            mkdir -p "$dir/sbom"
            cp build/sbom/supersonic-web.cdx.json build/sbom/clockwork-web.cdx.json "$dir/sbom/"
          done

      # The generated README stands in for the repository one on npm. It is
      # generated under build/, which is not packed: npm packs every README*
      # it finds at the root whatever `files` says, and a generated file at the
      # root shipped twice (the build inside `npm publish` made it again).
      - name: Generate npm README
        run: cp build/README.npm.md README.md

      - name: Publish supersonic-scsynth
        run: scripts/npm-publish-once.sh

      - name: Publish supersonic-scsynth-core
        working-directory: packages/supersonic-scsynth-core
        run: ../../scripts/npm-publish-once.sh

      - name: Publish supersonic-scsynth-synthdefs
        working-directory: packages/supersonic-scsynth-synthdefs
        run: ../../scripts/npm-publish-once.sh

      - name: Publish supersonic-scsynth-samples
        working-directory: packages/supersonic-scsynth-samples
        run: ../../scripts/npm-publish-once.sh

      - name: Publish supersonic-scsynth-bundle
        working-directory: packages/supersonic-scsynth-bundle
        run: ../../scripts/npm-publish-once.sh

      - name: Replace symlinks with actual files for distribution
        run: |
          # build-web.sh copies these in as real directories now; upstream's
          # symlinked them. Either way, replace them with the packages' files.
          rm -rf dist/synthdefs dist/samples

          echo "Copying all synthdefs..."
          mkdir -p dist/synthdefs
          cp -r packages/supersonic-scsynth-synthdefs/synthdefs/* dist/synthdefs/
          echo "Copied $(ls -1 dist/synthdefs/*.scsyndef | wc -l) synthdef files"

          echo "Copying all samples..."
          mkdir -p dist/samples
          cp -r packages/supersonic-scsynth-samples/samples/* dist/samples/
          echo "Copied $(ls -1 dist/samples/ | wc -l) sample files"

      - name: Create zip archive
        run: |
          mkdir -p supersonic
          cp -r dist/* supersonic/
          rm -rf supersonic/.github-pages
          cp -r sbom supersonic/
          VERSION="${GITHUB_REF_NAME:-dev}"
          sed "s/{{VERSION}}/$VERSION/" docs/README.dist.md > supersonic/README.md
          zip -r supersonic-dist.zip supersonic
          rm -rf supersonic

      - name: Prepare release assets
        run: |
          VERSION="${{ github.ref_name }}"
          cp supersonic-dist.zip "supersonic-${VERSION}.zip"
          cp supersonic-dist.zip supersonic.zip

      # Provenance a user checks with `gh attestation verify <file> --repo
      # samaaron/supersonic`: this workflow, this commit, built on GitHub. The
      # npm packages carry npm's own. supersonic.zip is the same bytes as the
      # versioned zip, so one attestation covers both.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            supersonic-${{ github.ref_name }}.zip
            build/sbom/*.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            supersonic-${{ github.ref_name }}.zip
            supersonic.zip
            build/sbom/*.cdx.json
          generate_release_notes: true
