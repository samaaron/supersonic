name: Publish to npm

# The release: a tag on a commit main has already tested. Nothing is tested
# or built twice. The gate below asks that every workflow's run for the push
# of this commit to main went green; the binaries and the deb come from
# those runs; the npm packages and the dist zip are built here, the one
# thing only a release makes. A dispatch with dry_run goes through all of
# it, publishing nothing: the way to try a change to this file.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Go through everything but publish nothing"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write   # to queue a job again that no runner took
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup esbuild
        run: npm install -g esbuild

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '4.0.21'
          actions-cache-folder: 'emsdk-cache'

      - name: Setup Rust (nightly for the shared-memory std, wasm32 for the MIDI and gamepad modules)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          targets: wasm32-unknown-unknown,wasm32-unknown-emscripten
          components: rust-src

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.127

      # Before the build: the bundling half of build-web.sh runs esbuild from
      # node_modules and resolves @thi.ng/malloc from there.
      - name: Install npm dependencies
        run: npm install

      - name: Build (release mode)
        run: ./scripts/build-web.sh --release

      - name: Run type tests
        run: npm run test:types

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      # Publishing is irreversible, so hold here until every other check run on
      # this commit is green — the native matrix (tag + main refs) and the web
      # Build-Test-Deploy all attach to the same SHA. Our own check run is
      # excluded by its job name. Cancelled or failed runs block the publish;
      # re-run them to green (or re-push the tag) to release.
      # The tag names the version the tree says it is, or this is the wrong
      # commit to release.
      - name: The tag names the version in package.json
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || {
            echo "The tag is ${GITHUB_REF_NAME} but package.json says ${version}: the wrong commit is tagged"; exit 1; }

      - name: Wait for this commit's runs on main to be green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # A commit is tested once, by the workflows its push to main ran:
          # every one of them must have completed green. A run cancelled
          # because main moved on, or one that failed, stops the release
          # with a reason; nothing is guessed about which run to believe,
          # since there is one run per workflow. Within a run, a job GitHub
          # cancelled before it ran a step is one no runner took (macOS
          # capacity), not a verdict on the code: it is queued again, three
          # times at most, and waited for.
          repo="repos/${GITHUB_REPOSITORY}"
          required="Native Build & Test|Debian Package|Build-Test-Deploy|security"
          reruns=""
          for attempt in $(seq 1 240); do
            if ! runs=$(gh api "${repo}/actions/runs?head_sha=${GITHUB_SHA}&event=push&branch=main&per_page=100" --paginate \
                          --jq '.workflow_runs[] | [.name, .id, .status, (.conclusion // "-")] | @tsv'); then
              echo "runs API error; retrying"
              sleep 30
              continue
            fi
            # One run per workflow: the newest when a run was done again.
            runs=$(printf '%s\n' "$runs" | awk -F'\t' '$1 != "" && !seen[$1]++')
            requeued=""
            while IFS=$'\t' read -r name id status conclusion; do
              [ -n "$id" ] || continue
              [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && continue
              while IFS=$'\t' read -r job_id job_name steps; do
                [ -n "$job_id" ] || continue
                [ "$steps" = "0" ] || continue
                tries=$(printf '%s\n' $reruns | grep -c "^${job_id}$")
                if [ "$tries" -ge 3 ]; then
                  echo "${name} / ${job_name} was never given a runner, three times: giving up"
                  continue
                fi
                echo "${name} / ${job_name} was never given a runner; queuing it again"
                gh api -X POST "${repo}/actions/jobs/${job_id}/rerun" >/dev/null 2>&1 || true
                reruns="${reruns} ${job_id}"
                requeued="${requeued}${job_name} "
              done < <(gh api "${repo}/actions/runs/${id}/jobs?per_page=100" --paginate \
                         --jq '.jobs[] | select(.conclusion == "cancelled") | [.id, .name, (.steps | length)] | @tsv' 2>/dev/null)
            done <<< "$runs"
            if [ -n "$requeued" ]; then
              sleep 30
              continue
            fi
            missing=""
            for w in $(printf '%s' "$required" | tr '|' '\n' | tr ' ' '_'); do
              w="${w//_/ }"
              printf '%s\n' "$runs" | awk -F'\t' -v w="$w" '$1 == w' | grep -q . || missing="${missing}${w}; "
            done
            if [ -n "$missing" ]; then
              echo "Attempt ${attempt}/240 — no run yet for: ${missing}"
              sleep 30
              continue
            fi
            bad=$(printf '%s\n' "$runs" | awk -F'\t' '$3=="completed" && $4!="success" && $4!="neutral" && $4!="skipped"')
            pending=$(printf '%s\n' "$runs" | awk -F'\t' '$3!="completed"')
            if [ -n "$bad" ]; then
              echo "Not publishing — this commit's runs on main are not green:"
              printf '%s\n' "$bad"
              echo "A cancelled run is one main moved on from: run it again (gh run rerun <id>) and then this."
              exit 1
            fi
            if [ -z "$pending" ]; then
              echo "This commit's runs on main are green:"
              printf '%s\n' "$runs"
              native=$(printf '%s\n' "$runs" | awk -F'\t' '$1=="Native Build & Test" {print $2}')
              debian=$(printf '%s\n' "$runs" | awk -F'\t' '$1=="Debian Package" {print $2}')
              echo "native_run=${native}" >> "$GITHUB_OUTPUT"
              echo "debian_run=${debian}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt ${attempt}/240 — still waiting on:"
            printf '%s\n' "$pending"
            sleep 30
          done
          echo "Timed out after 2h waiting for CI to complete"
          exit 1

      # The binaries and the deb this commit's runs built and kept.
      - name: Take the binaries from this commit's native run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.gate.outputs.native_run }}" --dir release-assets --pattern 'supersonic-*'
          gh run download "${{ steps.gate.outputs.debian_run }}" --dir debian-assets --name debian-trixie
          # The deb sits at the path it was built at inside its artifact.
          mkdir -p release-assets/debian
          find debian-assets -name '*.deb' -exec cp {} release-assets/debian/ \;
          find release-assets -type f

      - name: Write the SBOMs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node clockwork/scripts/sbom.mjs --root . target all build/sbom "$VERSION"
          # The Debian package is built with -DCLOCKWORK_PLUGINS=OFF (packaging/debian/rules):
          # its own document, beside the default linux-x64 one.
          node clockwork/scripts/sbom.mjs --root . target linux-x64 build/sbom "$VERSION" --option CLOCKWORK_PLUGINS=OFF --variant deb
          for dir in . packages/supersonic-scsynth-core; do
            mkdir -p "$dir/sbom"
            cp build/sbom/supersonic-web.cdx.json build/sbom/clockwork-web.cdx.json "$dir/sbom/"
          done

      # The generated README stands in for the repository one on npm. It is
      # generated under build/, which is not packed: npm packs every README*
      # it finds at the root whatever `files` says, and a generated file at the
      # root shipped twice (the build inside `npm publish` made it again).
      - name: Generate npm README
        run: cp build/README.npm.md README.md

      - name: Publish supersonic-scsynth
        if: github.event_name == 'push'
        run: scripts/npm-publish-once.sh

      - name: Publish supersonic-scsynth-core
        if: github.event_name == 'push'
        working-directory: packages/supersonic-scsynth-core
        run: ../../scripts/npm-publish-once.sh

      - name: Publish supersonic-scsynth-synthdefs
        if: github.event_name == 'push'
        working-directory: packages/supersonic-scsynth-synthdefs
        run: ../../scripts/npm-publish-once.sh

      - name: Publish supersonic-scsynth-samples
        if: github.event_name == 'push'
        working-directory: packages/supersonic-scsynth-samples
        run: ../../scripts/npm-publish-once.sh

      - name: Publish supersonic-scsynth-bundle
        if: github.event_name == 'push'
        working-directory: packages/supersonic-scsynth-bundle
        run: ../../scripts/npm-publish-once.sh

      - name: Replace symlinks with actual files for distribution
        run: |
          # build-web.sh copies these in as real directories now; upstream's
          # symlinked them. Either way, replace them with the packages' files.
          rm -rf dist/synthdefs dist/samples

          echo "Copying all synthdefs..."
          mkdir -p dist/synthdefs
          cp -r packages/supersonic-scsynth-synthdefs/synthdefs/* dist/synthdefs/
          echo "Copied $(ls -1 dist/synthdefs/*.scsyndef | wc -l) synthdef files"

          echo "Copying all samples..."
          mkdir -p dist/samples
          cp -r packages/supersonic-scsynth-samples/samples/* dist/samples/
          echo "Copied $(ls -1 dist/samples/ | wc -l) sample files"

      - name: Create zip archive
        run: |
          mkdir -p supersonic
          cp -r dist/* supersonic/
          rm -rf supersonic/.github-pages
          cp -r sbom supersonic/
          VERSION="${GITHUB_REF_NAME:-dev}"
          sed "s/{{VERSION}}/$VERSION/" docs/README.dist.md > supersonic/README.md
          zip -r supersonic-dist.zip supersonic
          rm -rf supersonic

      - name: Prepare release assets
        run: |
          VERSION="${{ github.ref_name }}"
          cp supersonic-dist.zip "supersonic-${VERSION}.zip"
          cp supersonic-dist.zip supersonic.zip

      # Provenance a user checks with `gh attestation verify <file> --repo
      # samaaron/supersonic`: this workflow, this commit, built on GitHub. The
      # npm packages carry npm's own. supersonic.zip is the same bytes as the
      # versioned zip, so one attestation covers both.
      - name: Attest the release assets
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            supersonic-${{ github.ref_name }}.zip
            build/sbom/*.cdx.json
            release-assets/**/*

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            supersonic-${{ github.ref_name }}.zip
            supersonic.zip
            build/sbom/*.cdx.json
            release-assets/**/*
          generate_release_notes: true
