# SuperSonic's Rust workspace.
#
# Clockwork's crates are NOT members: they belong to clockwork and are
# built from the submodule as path dependencies. Only what is SuperSonic's own
# lives here — the engine layer, and the umbrella that joins both halves into
# the single staticlib a binary may link.
[workspace]
resolver = "2"
members = [
    "supersonic-ugen-abi",
    "supersonic-node-mirror",
    "supersonic-buffers",
    "supersonic-limiter",
    "supersonic-nodetree",
    "supersonic-native",
    "supersonic-transport-probe",
]
