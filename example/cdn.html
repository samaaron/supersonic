<!DOCTYPE html>
<html>
  <head>
    <title>SuperSonic CDN Demo</title>
  </head>
  <body>
    <h1>SuperSonic CDN Demo</h1>
    <p>Everything loaded from CDN - no server setup required!</p>
    <button id="play">Play Amen Break</button>
    <script type="module">
      // Everything from the CDN. Name the file (jsDelivr serves a bare
      // package URL without redirecting, and the client's chunk imports are
      // relative), say where the core package is (the client package ships
      // no wasm), and — up to 0.81.0 — where its wasm directory is.
      import { SuperSonic } from "https://unpkg.com/supersonic-scsynth@0.83.1/dist/supersonic.js";
      const CDN = "https://unpkg.com/";
      const button = document.getElementById("play");
      let sonic = null;
      button.onclick = async () => {
        if (!sonic) {
          button.textContent = "Booting scsynth...";
          sonic = new SuperSonic({
            mode: "postMessage",
            baseURL:         CDN + "supersonic-scsynth@0.83.1/dist/",
            coreBaseURL:     CDN + "supersonic-scsynth-core@0.83.1/",
            wasmBaseURL:     CDN + "supersonic-scsynth-core@0.83.1/wasm/",
            sampleBaseURL:   CDN + "supersonic-scsynth-samples@0.83.1/samples/",
            synthdefBaseURL: CDN + "supersonic-scsynth-synthdefs@0.83.1/synthdefs/",
          });
          await sonic.init();
          await sonic.loadSynthDefs(["sonic-pi-basic_stereo_player"]);
          await sonic.loadSample(0, "loop_amen.flac");
          button.textContent = "Play Amen Break";
        }

        sonic.send("/s_new", "sonic-pi-basic_stereo_player", -1, 0, 0, "buf", 0);
      };
    </script>
  </body>
</html>
